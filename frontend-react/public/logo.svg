<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rounded square background -->
  <rect width="48" height="48" rx="12" fill="#1d4ed8"/>

  <!-- Medical cross — vertical bar -->
  <rect x="20" y="10" width="8" height="28" rx="2" fill="white"/>
  <!-- Medical cross — horizontal bar -->
  <rect x="10" y="20" width="28" height="8" rx="2" fill="white"/>

  <!-- ECG pulse line over the cross center -->
  <polyline
    points="13,24 17,24 19,18 21,30 23,22 25,26 27,24 35,24"
    stroke="#93c5fd"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>

# Healthcare QA Chatbot — CI/CD Pipeline

name: Healthcare QA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Secret scanning ────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # uncomment for org repos

  # ── Python lint ────────────────────────────────────────────────────────────
  lint-python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ api/ --select E,W,F --ignore E501

  # ── Backend tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Create expected directories
        run: mkdir -p data/raw data/processed data/knowledge_base_v2 models outputs

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SKIP_BM25: "true"
          DEFAULT_MODEL: "extractive"
          MIN_ANSWER_CONFIDENCE: "0.0"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing \
            --ignore=tests/e2e -x

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── Frontend type-check + build ────────────────────────────────────────────
  test-frontend:
    name: Frontend (Next.js type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          # Point at a dummy URL for the build — runtime value comes from Vercel env
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Docker build (backend) ─────────────────────────────────────────────────
  docker-backend:
    name: Build backend Docker image
    needs: [test-backend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-
            type=raw,value=latest,enable=true

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy backend to HF Spaces ────────────────────────────────────────────
  deploy-hf-spaces:
    name: Deploy backend → HF Spaces
    needs: [test-backend, test-frontend, secret-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: kbsss/healthcare-qa-api
        run: |
          git config --global user.email "ci@github-actions"
          git config --global user.name "GitHub Actions"
          # Export only backend files — HF Spaces rejects large binaries/notebooks
          DEPLOY_DIR=$(mktemp -d)
          git archive HEAD -- \
            api/ src/ config/ requirements.txt Dockerfile .dockerignore \
            pyproject.toml start.sh Makefile data/drug_knowledge/ tests/ \
            | tar -x -C "$DEPLOY_DIR"
          printf -- "---\ntitle: Healthcare QA API\nemoji: 🏥\ncolorFrom: blue\ncolorTo: red\nsdk: docker\napp_port: 7860\npinned: false\n---\n" \
            > "$DEPLOY_DIR/README.md"
          cd "$DEPLOY_DIR"
          git init -b main
          git add -A
          git commit -m "chore: deploy to HF Spaces from CI (sha: $GITHUB_SHA)"
          git remote add space \
            "https://kbsss:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push space main --force

  # ── Security scan (filesystem) ─────────────────────────────────────────────
  security:
    name: Trivy security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

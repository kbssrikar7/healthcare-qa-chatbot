# Healthcare QA Chatbot — Docker Compose
# Run with:   docker-compose up -d
# Stop with:  docker-compose down
#
# Requires:
#   - data/knowledge_base_v2/ (ChromaDB KB v2 index — 505K docs)
#   - models/                 (TinyLlama cached from HuggingFace)
#
# First time setup:
#   cp .env.example .env
#   docker-compose up --build
#
# Fast dev startup (skips warmup query — first query is cold):
#   docker-compose --profile dev up --build

version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-qa-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - USE_GPU=${USE_GPU:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      # KB v2 — 505K docs (RecursiveSentenceChunker, dense-only retrieval)
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-medical_knowledge_v2}
      - KB_PERSIST_DIR=${KB_PERSIST_DIR:-data/knowledge_base_v2}
      # Skip BM25 to save ~2 GB RAM (KB v2 eval was dense-only, kw=0.6765)
      - SKIP_BM25=${SKIP_BM25:-true}
      - MIN_ANSWER_CONFIDENCE=${MIN_ANSWER_CONFIDENCE:-0.0}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - mediquery-net

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-qa-api-dev
    profiles: ["dev"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - USE_GPU=false
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-medical_knowledge_v2}
      - KB_PERSIST_DIR=${KB_PERSIST_DIR:-data/knowledge_base_v2}
      - SKIP_BM25=true
      - SKIP_STARTUP_WARMUP=true
      - MIN_ANSWER_CONFIDENCE=0.0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - mediquery-net

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: healthcare-qa-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mediquery-net

networks:
  mediquery-net:
    driver: bridge

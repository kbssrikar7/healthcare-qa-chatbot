<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0;
    width: 1024px; height: 500px;
    overflow: hidden;
    background: #0F172A;
    font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
  }
  .canvas {
    width: 1024px; height: 500px;
    position: relative;
    background: radial-gradient(circle at 78% 20%, rgba(29,78,216,0.35) 0%, rgba(15,23,42,0) 55%),
                #0F172A;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    box-sizing: border-box;
    padding-left: 88px;
  }
  .lockup { display: flex; align-items: center; gap: 22px; }
  .icon {
    width: 96px; height: 96px;
    border-radius: 24px;
    background: #1D4ED8;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .wordmark {
    color: #F8FAFC;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .tagline {
    margin-top: 26px;
    color: #93C5FD;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.2px;
  }
  .subtagline {
    margin-top: 10px;
    color: #94A3B8;
    font-size: 19px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="lockup">
      <div class="icon">
        <svg width="60" height="60" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="10" width="8" height="28" rx="2" fill="white"/>
          <rect x="10" y="20" width="28" height="8" rx="2" fill="white"/>
          <polyline points="13,24 17,24 19,18 21,30 23,22 25,26 27,24 35,24"
            stroke="#93c5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="wordmark">MediQuery</div>
    </div>
    <div class="tagline">Offline AI medical Q&amp;A — grounded, cited, on-device</div>
    <div class="subtagline">No account. No internet permission. Your questions never leave your phone.</div>
  </div>
</body>
</html>
